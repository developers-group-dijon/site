name: Publication — gardien

# Filtre les demandes de publication (issues ouvertes avec les formulaires
# « Annoncer un événement » et « Publier une news ») et les commandes de
# validation en commentaire. Aucune IA ici : seulement des labels et des
# réponses. Quand une demande ou une commande est acceptée, le job
# « traiter » lance publication.yml. Quand GitHub ferme l'issue au merge de
# sa Pull Request, le job « publiee » pose « publication:publiee ».
# Scripts : scripts/publication/.

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  gardien:
    # Uniquement les issues de publication (pas les Pull Requests),
    # et pas les commentaires des bots (dont ceux du traitement).
    if: >-
      contains(github.event.issue.labels.*.name, 'publication')
      && !github.event.issue.pull_request
      && github.event.action != 'closed'
      && (github.event_name == 'issues' || github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-26.04
    # Un seul gardien à la fois par issue.
    concurrency:
      group: publication-gardien-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    outputs:
      a_traiter: ${{ steps.accueil.outputs.a_traiter || steps.commandes.outputs.a_traiter }}
    steps:
      # Les scripts et la liste des membres sont lus sur la branche par
      # défaut (main), jamais depuis l'issue ou une autre branche.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/publication
          persist-credentials: false

      # Contenus fournis par les utilisateurs et utilisatrices : passés en
      # variables d'environnement, jamais interpolés dans le script.
      - name: Accueillir la demande
        id: accueil
        if: github.event_name == 'issues'
        env:
          AUTEUR: ${{ github.event.issue.user.login }}
        run: |
          resultat="$(python3 scripts/publication/accueillir-issue.py "$ISSUE" "$AUTEUR")"
          if [ "$resultat" = "a-traiter" ]; then echo "a_traiter=true" >>"$GITHUB_OUTPUT"; fi

      - name: Vérifier les commandes du commentaire
        id: commandes
        if: github.event_name == 'issue_comment'
        env:
          AUTEUR: ${{ github.event.comment.user.login }}
          COMMENTAIRE: ${{ github.event.comment.body }}
          COMMENTAIRE_ID: ${{ github.event.comment.id }}
        run: |
          resultat="$(printf '%s' "$COMMENTAIRE" | python3 scripts/publication/verifier-commandes.py "$ISSUE" "$AUTEUR" "$COMMENTAIRE_ID")"
          if [ "$resultat" = "a-traiter" ]; then echo "a_traiter=true" >>"$GITHUB_OUTPUT"; fi

  # Un label posé avec le jeton du workflow ne déclenche pas d'autre
  # workflow : le traitement est donc appelé ici, après le gardien.
  traiter:
    needs: gardien
    if: needs.gardien.outputs.a_traiter == 'true'
    uses: ./.github/workflows/publication.yml
    with:
      issue: ${{ format('{0}', github.event.issue.number) }}
    secrets: inherit

  # Fermée comme terminée (le « Closes #N » de la Pull Request ou du commit
  # « Annonce » au merge dans main) alors qu'elle était prête : publiée.
  publiee:
    if: >-
      github.event.action == 'closed'
      && github.event.issue.state_reason == 'completed'
      && contains(github.event.issue.labels.*.name, 'publication:prete')
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/publication
          persist-credentials: false

      - name: Marquer la demande comme publiée
        run: python3 scripts/publication/marquer-publiee.py "$ISSUE"
