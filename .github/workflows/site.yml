name: Site

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Asciidoctor
        run: gem install --no-document asciidoctor rouge

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build production
        run: hugo build --minify
        env:
          TZ: Europe/Paris

      - name: Build test
        run: hugo build --minify --environment test --baseURL https://www-test.developers-group-dijon.fr/ --destination public-test
        env:
          TZ: Europe/Paris

      - name: Upload public dir
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

      - name: Upload public-test dir
        uses: actions/upload-artifact@v7
        with:
          name: public-test
          path: public-test
          retention-days: 7

  deploy-test:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    environment:
      name: test
      url: https://www-test.developers-group-dijon.fr/
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - name: Download public-test dir
        uses: actions/download-artifact@v8
        with:
          name: public-test
          path: public-test
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload sftp
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_NAME: test
        # --delete : supprime du serveur tout ce qui n'est pas dans la nouvelle version
        run: |
          for v in SFTP_HOST SFTP_USER LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v est vide : secret absent de l'environnement GitHub « $ENV_NAME » ou du dépôt"
              exit 1
            fi
          done
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose --parallel=4 public-test/ www_test/
          bye
          EOF

  deploy-production:
    needs: [build, deploy-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://www.developers-group-dijon.fr/
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download public dir
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Upload sftp
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          ENV_NAME: production
        # --delete : supprime du serveur tout ce qui n'est pas dans la nouvelle version
        run: |
          for v in SFTP_HOST SFTP_USER LFTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::$v est vide : secret absent de l'environnement GitHub « $ENV_NAME » ou du dépôt"
              exit 1
            fi
          done
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" <<'EOF'
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose --parallel=4 public/ www/
          bye
          EOF
