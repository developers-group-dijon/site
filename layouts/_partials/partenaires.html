<ul class="partenaires">
  {{- range site.Data.partenaires }}
  <li>
    {{- if .url }}
    {{ $logo := printf `<img src="/images/partenaires/%s" alt="%s" loading="lazy" decoding="async">` .logo (htmlEscape .nom) | safeHTML }}
    {{ partial "lien.html" (dict "url" .url "texte" $logo) }}
    {{- else }}
    <span><img src="/images/partenaires/{{ .logo }}" alt="{{ .nom }}" loading="lazy" decoding="async"></span>
    {{- end }}
  </li>
  {{- end }}
</ul>
