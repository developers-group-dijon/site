<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- Exemple de vignette du site (1600 × 900, carte en 16:9).
       Direction « scène » : fond sombre tramé, titre pixel rose, bandeau jaune. -->
  <defs>
    <!-- Trame « pixel » de la charte : damier de 6 px -->
    <pattern id="trame" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#000" fill-opacity="0.15"/>
      <rect x="3" y="3" width="3" height="3" fill="#000" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="1600" height="900" fill="#212121"/>
  <rect width="1600" height="900" fill="url(#trame)"/>

  <!-- Motif décoratif à droite : escalier de pixels en dégradé de roses -->
  <g shape-rendering="crispEdges">
    <rect x="1040" y="660" width="560" height="240" fill="#9a1a41"/>
    <rect x="1120" y="580" width="480" height="80" fill="#a8284f"/>
    <rect x="1200" y="500" width="400" height="80" fill="#b3345b"/>
    <rect x="1280" y="420" width="320" height="80" fill="#c2456a"/>
    <rect x="1360" y="340" width="240" height="80" fill="#ffb7c1"/>
    <rect x="1440" y="260" width="80" height="80" fill="#ffd93d"/>
    <rect x="1040" y="340" width="560" height="560" fill="url(#trame)"/>
  </g>

  <!-- Surtitre -->
  <text x="90" y="200" font-family="Bitcount Grid Single" font-weight="500" font-size="40" fill="#ffd93d" letter-spacing="2">MEETUP</text>

  <!-- Titre (1 à 2 lignes, 120 px maximum) -->
  <text x="84" y="340" font-family="Bitcount Grid Single" font-weight="700" font-size="120" fill="#c2456a">Titre court</text>

  <!-- Sous-titre (Noto Sans, 1 ou 2 lignes) -->
  <text font-family="Noto Sans" font-size="38" fill="#ffffff">
    <tspan x="90" y="450" font-weight="300">Une phrase d'accroche qui dit l'essentiel,</tspan>
    <tspan x="90" y="502" font-weight="700">et une seconde ligne en gras.</tspan>
  </text>

  <!-- Bandeau date et lieu -->
  <rect x="90" y="600" width="660" height="64" fill="#ffd93d"/>
  <text x="114" y="645" font-family="Bitcount Grid Single" font-weight="500" font-size="34" fill="#212121">JEU. 12 NOV. · 18H30 · DIJON</text>

  <!-- Logo de l'association -->
  <image x="90" y="770" width="161" height="70" xlink:href="../ressources/logo-dgd-blanc.png"/>
</svg>
